name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs, because a tag can be moved to other
# code. Dependabot updates the SHA and the version comment together.
jobs:
  # The tests on every system the plugin runs on, with Node.js 22 (the oldest
  # version package.json allows) and 26 (the current LTS release).
  test:
    name: test (${{ matrix.os }}, Node.js ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      # The runtime dependency needs no install scripts, so none are run. Only
      # plugin/ ships, so its dependencies are installed there; the repository
      # root has none.
      - name: Install dependencies
        working-directory: plugin
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

  # Checks whose result does not depend on the system: once, on Linux.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        working-directory: plugin
        run: npm ci --ignore-scripts

      # Any known vulnerability fails the build, whatever its level, as SECURITY.md says.
      - name: Check dependencies for known vulnerabilities
        working-directory: plugin
        run: npm audit --omit=dev

      # TypeScript is a development tool only, so it is installed here, in the
      # repository root, and not listed in a package.json: Claude Code installs
      # the plugin's dependencies on every user's machine. Exact versions, so a
      # new release cannot change what CI runs. scripts/check.js (npm run check)
      # pins the same versions and fails when the two differ.
      - name: Type-check
        run: |
          npm install --no-save --ignore-scripts typescript@7.0.2 @types/node@22.20.5
          npx tsc -p jsconfig.json

      - name: Check that docs/checks.md matches the code
        run: node scripts/gen-checks-doc.js --check

      - name: Check plugin directory rules
        run: node scripts/check-directory-rules.js

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # An exact version: an unpinned install would run whatever was published last.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.322

      - name: Validate the marketplace
        run: claude plugin validate . --strict

      - name: Validate the plugin manifest and skills
        run: claude plugin validate plugin --strict --profile directory
