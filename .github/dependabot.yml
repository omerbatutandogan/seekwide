# Keeps the two runtime dependencies (in plugin/, the only folder that ships)
# and the CI actions current.
version: 2
updates:
  - package-ecosystem: npm
    directory: /plugin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
