<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact - Harbor Lane Plumbing</title>
<meta name="description" content="Ask a made-up plumbing firm for a visit or a quote.">
<link rel="canonical" href="{origin}/contact.html">
<script>window.__tcfapi = window.__tcfapi || function () { (window.__tcfapiQueue = window.__tcfapiQueue || []).push(arguments); };</script>

<body>
<nav><a href="/">Home</a> <a href="/services.html">Services</a> <a href="/contact.html">Contact</a></nav>
<main>
<h1>Ask for a visit</h1>
<p>Tell us what is wrong and where, and the office calls you back on the same working day with a time and a fixed price.</p>
<form method="post" action="/send-request">
<p><label for="name">Your name</label> <input type="text" id="name" name="name" autocomplete="nope"></p>
<p><label for="email">Email</label> <input type="text" id="email" name="email"></p>
<p><label for="email-confirm">Confirm email</label> <input type="email" id="email-confirm" name="email_confirm" autocomplete="email" onpaste="return false"></p>
<p><label for="phone">Phone</label> <input type="text" id="phone" name="phone"></p>
<p>Postcode <input type="text" name="postcode"></p>
<p><textarea name="message" placeholder="What needs fixing?"></textarea></p>
<p><button type="submit">Send</button></p>
</form>
<p>In a hurry? <a href="tel:1-800-PLUMBER">Call 1-800-PLUMBER</a>.</p>
</main>
</body>
</html>
