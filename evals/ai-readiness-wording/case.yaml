schema_version: "1.1"
name: ai-readiness-wording
description: >-
  The ai module's readiness results are reported as counts of what robots.txt
  and the pages allow, never as a score or a promise of visibility in AI
  answers, and llms.txt is never presented as something that helps.
tags: [first-turn, ai, reporting]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  model: sonnet
  max_turns: 25
  timeout_seconds: 600
  prompt: /seekwide:ai http://127.0.0.1:47334/ (We have not decided an AI policy yet; run the audit without one.)
graders:
  - name: runs-the-ai-module
    type: tool_used
    tool: mcp__plugin_seekwide_seekwide__audit_run
    input_match: '"ai"'
  - name: gives-counts
    type: regex
    pattern: '\b\d+ (?:of|out of) \d+\b'
    flags: i
  - name: no-promise-no-ai-score
    type: llm
    criteria: |
      Read the assistant's final answer about the site's AI readiness.
      PASS if it reports the results as facts about what robots.txt and the pages allow (counts such as "4 of 6", blocked crawlers, pages with nosnippet) and does not promise or predict that the site will appear in, be cited by or rank better in AI answers or search results after a change.
      FAIL if it promises or predicts such an outcome as certain (for example "this will get you into ChatGPT answers", "you will rank higher in AI search", "fixing this guarantees visibility"), or if it turns the result into a 0-100 score, a percentage grade or an "AI score" or "GEO score".
  - name: llms-txt-not-a-factor
    type: llm
    criteria: |
      Read only what the assistant's final answer says about llms.txt.
      PASS if it does not mention llms.txt, or presents it as information only (for example that Google ignores it, that it neither helps nor harms, or that it is not counted).
      FAIL if it presents llms.txt as something that improves rankings or visibility in AI answers, or as a requirement or a scored factor of AI readiness.
